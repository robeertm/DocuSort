services:
  docusort:
    image: ghcr.io/robeertm/docusort:latest
    container_name: docusort
    restart: unless-stopped
    ports:
      - "9876:9876"           # Web UI; open http://<nas-ip>:9876
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TZ=Europe/Berlin
      - DOCUSORT_LOG_LEVEL=INFO
    volumes:
      # Adjust the left side of each mapping to wherever your documents live.
      - ./data/inbox:/data/inbox
      - ./data/library:/data/library
      - ./config:/app/config
      - ./logs:/app/logs

  # ── Keeps itself up to date ────────────────────────────────────────────
  # Docker never re-pulls a running container: `image: …:latest` is a label,
  # not a subscription. Without the service below DocuSort would stay on the
  # image you first pulled, forever, and you would have to remember
  #     docker compose pull && docker compose up -d
  #
  # So it is ON by default — you should not have to do anything to get fixes.
  # What that costs, stated plainly:
  #   * it needs the Docker socket, which is effectively root on the host.
  #     Mounted READ-ONLY here, but still a privilege you are granting.
  #   * it updates on ITS schedule: once an hour, on the hour. A fix you
  #     are waiting for should not have to wait until tomorrow night.
  #   * it watches ONLY the docusort container (named at the end of the
  #     command). If you already run a Watchtower of your own, the two do not
  #     fight — they look at different containers.
  #
  # To switch it off: delete this service, or `docker compose stop watchtower`.
  # To change when it runs, put a cron line in `.env`:
  #     WATCHTOWER_SCHEDULE=0 0 4 * * *      # or once a night at 04:00
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: docusort-watchtower
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --cleanup
      - --schedule
      - ${WATCHTOWER_SCHEDULE:-0 0 * * * *}
      - docusort
