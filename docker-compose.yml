services:
  docusort:
    image: ghcr.io/robeertm/docusort:latest
    container_name: docusort
    restart: unless-stopped
    ports:
      - "9876:9876"           # Web UI; open http://<nas-ip>:9876
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TZ=Europe/Berlin
      - DOCUSORT_LOG_LEVEL=INFO
    volumes:
      # Adjust the left side of each mapping to wherever your documents live.
      - ./data/inbox:/data/inbox
      - ./data/library:/data/library
      - ./config:/app/config
      - ./logs:/app/logs
    # 🔴 OHNE DIESE ZEILE FINDET DIE SUCHE NACH EINEM LOKALEN MODELL NICHTS.
    # DocuSort fragt im Container nach einem Ollama unter `host.docker.internal`
    # — der übliche Fall ist ein Modell auf dem Rechner, auf dem der Container
    # sitzt. Docker Desktop (Mac, Windows) erfindet diesen Namen von selbst. Auf
    # Linux — also auf der NAS, dem Pi, dem VPS, wo das wirklich installiert wird
    # — gibt es ihn nicht, solange er hier nicht abgebildet ist. Auf einer
    # Synology gemessen: ohne die Zeile „Name or service not known", mit ihr
    # antwortet der Wirt.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Keeps itself up to date ────────────────────────────────────────────
  # Docker never re-pulls a running container: `image: …:latest` is a label,
  # not a subscription. Without the service below DocuSort would stay on the
  # image you first pulled, forever, and you would have to remember
  #     docker compose pull && docker compose up -d
  #
  # So it is ON by default — you should not have to do anything to get fixes.
  # What that costs, stated plainly:
  #   * it needs the Docker socket, which is effectively root on the host.
  #     Mounted READ-ONLY here, but still a privilege you are granting.
  #   * it updates on ITS schedule: once an hour, on the hour. A fix you
  #     are waiting for should not have to wait until tomorrow night.
  #   * it watches ONLY the docusort container (named at the end of the
  #     command). If you already run a Watchtower of your own, the two do not
  #     fight — they look at different containers.
  #
  # To switch it off: delete this service, or `docker compose stop watchtower`.
  # To change when it runs, put a cron line in `.env`:
  #     WATCHTOWER_SCHEDULE=0 0 4 * * *      # or once a night at 04:00
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower:latest
    container_name: docusort-watchtower
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --cleanup
      # 🔴 OHNE DIESE FLAGGE KOMMT EINE KAPUTTE FASSUNG NIE ZURUECK.
      #    Watchtower sieht Container im Zustand `restarting` sonst GAR
      #    NICHT — am Pi gemessen: laufend `scanned=1, updated=1`,
      #    abstuerzend `scanned=0`. Startet DocuSort nach einem Update
      #    nicht mehr, bliebe es stehen, bis jemand von Hand eingreift.
      #    Mit der Flagge holt der naechste Lauf die heile Fassung.
      - --include-restarting
      - --schedule
      - ${WATCHTOWER_SCHEDULE:-0 0 * * * *}
      - docusort
      # Das lokale Modell mit, wenn das Profil `ki` an ist. Auch benannt, wenn es
      # aus ist: ein Name, auf den nichts passt, wird übersprungen — ein
      # Container, den niemand benannt hat, wird dagegen nie aktualisiert, und
      # das ist der Fehler, den man nicht merkt.
      - docusort-ollama

  # ── Ein lokales Modell, in der Kiste nebenan (freiwillig) ───────────────
  # 🔑 WARUM DAS HIER STEHT
  # DocuSort kann seine Dokumente von einem lokalen Modell einordnen lassen —
  # dann verlässt kein Kontoauszug das Haus, es gibt keinen Schlüssel, kein Konto
  # und keine Rechnung. Bisher setzte das voraus, dass irgendwo schon ein Ollama
  # läuft und man seine Adresse kennt. Dieser Dienst ist der kurze Weg:
  #
  #     docker compose --profile ki up -d
  #
  # Er bleibt AUS, solange ihn niemand beim Namen nennt — ein Download von
  # zwei Gigabyte und mehrere Gigabyte Arbeitsspeicher drängt man niemandem auf,
  # der nur seine Scans sortiert haben wollte.
  #
  # Danach in den Einstellungen: KI → „lokales Modell suchen". Die Suche findet
  # es von selbst unter `http://ollama:11434`, weil das ein Dienstname AUS DIESER
  # DATEI ist, aufgelöst im Docker-Netz. Nichts einzutippen.
  #
  # 🔑 DAS MODELL HOLT DOCUSORT SELBST. Auf der Startseite steht dafuer ein
  #    Knopf; er misst vorher, was diese Maschine kann, waehlt danach das
  #    Modell und zeigt den Fortschritt. Von Hand ginge es auch:
  #
  #     docker compose exec ollama ollama pull qwen2.5:7b-instruct
  #
  # 🔴 Ein Ollama OHNE Modell antwortet auf der Vorderseite 200 und auf jede
  #    Frage 404 — „erreichbar" ist deshalb nie dasselbe wie „einsatzbereit".
  #
  # 🔑 WELCHES MODELL — gemessen, nicht geraten, auf einer Synology mit AMD Ryzen
  #    V1500B (vier Kerne, keine Grafikkarte), also auf der Art Rechner, auf der
  #    das hier landet. DIESELBE Stromrechnung, eingeordnet auf dem echten Weg
  #    des Programms, gegen eine echte Kategorienliste:
  #      qwen2.5:3b-instruct    186 s   ->  Kategorie „Haus"
  #      qwen2.5:7b-instruct    465 s   ->  Kategorie „Rechnungen"
  #    Das kleinere ist zweieinhalbmal schneller und legt das Dokument in die
  #    falsche Schublade. Ein Dokument in der falschen Schublade ist ein
  #    Dokument, das man wieder suchen muss — darum hier das größere.
  #
  #    🔴 Teuer ist nicht das Schreiben der Antwort, sondern das LESEN der Frage,
  #    und das wächst mit der Länge des Dokuments. Ein Scan ist lang. Auf einem
  #    Mac mit Apple Silicon ist beides ein Vielfaches schneller — wer einen hat,
  #    der immer läuft, fährt besser mit `provider: bridge`.
  ollama:
    image: ollama/ollama:latest
    container_name: docusort-ollama
    # 🔑 KEIN `profiles` MEHR — der Dienst laeuft von Anfang an mit.
    #
    # Vorher stand hier `profiles: ["ki"]`, und damit startete er nur, wenn
    # jemand `docker compose --profile ki up` tippte. Das wusste niemand, der
    # DocuSort zum ersten Mal installiert, und es stand auch nirgends auf dem
    # Weg, den er geht. Ergebnis: ein fertiges lokales Modell lag einen Befehl
    # entfernt und wurde nie benutzt.
    #
    # 🔴 DocuSort kann diesen Container NICHT selbst starten — es hat bewusst
    #    keinen Zugriff auf den Docker-Socket, der waere root auf dem Wirt.
    #    Also muss der Dienst schon laufen, damit der Knopf „lokales Modell
    #    einrichten" auf der Startseite ueberhaupt etwas tun kann. Was er dann
    #    tut, braucht keine Docker-Rechte: ein Modell holen.
    #
    # Was das kostet, wenn es ungenutzt bleibt: das Abbild belegt Plattenplatz
    # (gemessen 5,57 GB, weil die Grafikkarten-Bibliotheken mit drin sind), im
    # Leerlauf ohne geladenes Modell aber kaum Arbeitsspeicher und keine CPU.
    # Wer das nicht will, loescht diesen Block oder haelt ihn an:
    #     docker compose stop ollama
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Berlin}
      # 🔴 NIE ENTLADEN. Ollama vergisst ein Modell nach fünf untätigen Minuten
      # und lädt es bei der nächsten Frage neu — auf der NAS gemessen 30 s für
      # ein 7B. Das käme oben auf jede Wartezeit drauf, und zwar genau dann, wenn
      # nach einer Pause der erste Scan hereinfällt. Im Speicher gehalten kostet
      # es die Größe des Modells und sonst nichts.
      - OLLAMA_KEEP_ALIVE=-1
      # Ein Modell, eine Frage auf einmal. Zwei gleichzeitig sind auf einem
      # Rechner ohne Grafikkarte langsamer als zwei hintereinander — und doppelt
      # so viel Speicher.
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      # Die Modelle sind Gigabytes und gehören dir, nicht dem Abbild — ohne das
      # hier wären sie nach jedem `docker compose pull` wieder weg.
      - ./ollama:/root/.ollama
    # Kein Port auf dem Wirt. DocuSort erreicht es über den Dienstnamen im
    # Docker-Netz; veröffentlicht wäre es eine Schnittstelle ohne Passwort im
    # eigenen LAN.
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
