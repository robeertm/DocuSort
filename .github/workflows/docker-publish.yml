# Builds the DocuSort image for amd64 and arm64 and publishes it to the
# GitHub Container Registry, so `docker pull ghcr.io/<owner>/<repo>:latest`
# works without anyone having to build anything.
name: Publish container image

on:
  push:
    branches: [main]
  workflow_dispatch:

# 🔴 Deliberately NOT on tags. A push to main already publishes both
# `:latest` and `:<version>`, so a tag adds no image — but it would start a
# build from the TAGGED commit that pushes `:latest` too. Tag an older
# version (to fill in a release history, say) and every customer on
# `:latest` would be handed OLD code by the next pull. Tags are git markers
# and release archives here; the image comes from main.

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Repository name in lower case
        id: repo
        # GHCR refuses an upper-case path: "repository name must be lowercase".
        run: echo "slug=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Read version
        id: ver
        run: echo "version=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('docusort/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # 🔴 HIER STEHT KEIN `:latest` MEHR (04.10.2026).
          #
          # Es stand hier, und damit wanderte das Etikett, dem jede
          # Kundeninstallation folgt, in dem Moment, in dem jemand nach main
          # pusht — also BEVOR irgendetwas das gebaute Abbild geprüft hat.
          # Das Auslieferungstor prüft ein LOKAL gebautes Abbild; was Kunden
          # bekommen, hat es nie angefasst.
          #
          # Am 04.10. ging so eine Fassung hinaus, die auf bestehenden
          # Datenbanken nicht startete. Watchtower verteilte sie um 20:36;
          # die Installationen standen still — und wären NICHT von selbst
          # zurückgekommen (Watchtower sieht abstürzende Container nicht).
          #
          # Jetzt veröffentlicht ein Push nur die Versionsmarke und `edge`.
          # `:latest` setzt `promote.yml` — von Hand, nach grünem Tor gegen
          # GENAU DIESES veröffentlichte Abbild.
          tags: |
            ghcr.io/${{ steps.repo.outputs.slug }}:${{ steps.ver.outputs.version }}
            ghcr.io/${{ steps.repo.outputs.slug }}:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
