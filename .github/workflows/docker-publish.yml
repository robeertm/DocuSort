# Builds the DocuSort image for amd64 and arm64 and publishes it to the
# GitHub Container Registry, so `docker pull ghcr.io/<owner>/<repo>:latest`
# works without anyone having to build anything.
name: Publish container image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Repository name in lower case
        id: repo
        # GHCR refuses an upper-case path: "repository name must be lowercase".
        run: echo "slug=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Read version
        id: ver
        run: echo "version=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('docusort/__init__.py').read()).group(1))")" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.slug }}:latest
            ghcr.io/${{ steps.repo.outputs.slug }}:${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
